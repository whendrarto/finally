# E2E test stack: the app (LLM mocked, fresh DB dir) + a Playwright runner.
# From the project root:
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down
name: finally-e2e

services:
  # not "app": .app is an HSTS-preloaded TLD, so Chromium would force https://app
  finally-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finally:test
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      OPENROUTER_API_KEY: "not-needed-in-mock-mode"
    # tmpfs gives every run a fresh, empty database directory
    tmpfs:
      - /app/db:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    depends_on:
      finally-app:
        condition: service_healthy
    working_dir: /work
    environment:
      BASE_URL: http://finally-app:8000
      CI: "true"
    volumes:
      - ./:/work
      # keep the container's Linux node_modules separate from the host's
      - /work/node_modules
    command: ["bash", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    ipc: host
